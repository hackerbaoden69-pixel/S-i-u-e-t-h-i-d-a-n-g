<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Thị Đăng - Mini Game May Mắn Rực Rỡ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #12072b;
            color: #ffffff;
            text-align: center;
            padding: 20px 10px;
        }
        .header {
            background: #22134a;
            border: 3px solid #ffeb3b;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 235, 59, 0.3);
        }
        .header h1 { color: #ffeb3b; font-size: 24px; margin-bottom: 5px; }
        .header p { color: #00f0ff; font-size: 13px; }
        
        .card {
            background: #22134a;
            border: 3px solid #ff007a;
            border-radius: 15px;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto 20px auto;
        }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #ffeb3b; margin-bottom: 5px; font-weight: bold; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ff007a;
            background: #000;
            color: #fff;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #ffeb3b, #ff6d00, #ff007a);
            color: #000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Wheel Container */
        .wheel-box {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
        }
        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #ffeb3b;
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99);
        }
        .spin-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ffeb3b;
            color: #000;
            border: 4px solid #fff;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ffeb3b;
            z-index: 10;
        }

        /* Modal thông báo kết quả */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #22134a;
            border: 4px solid #ffeb3b;
            border-radius: 20px;
            padding: 25px;
            max-width: 350px;
            width: 90%;
            text-align: center;
        }
        .modal-content h2 { color: #ffeb3b; margin-bottom: 10px; }
        .reward-text { color: #00f0ff; font-size: 18px; font-weight: bold; margin: 15px 0; }
        .footer { font-size: 11px; color: #aaa; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SIÊU THỊ ĐĂNG 🎪</h1>
        <p>Vòng Quay & Bốc Thăm Tặng Bánh OXI Siêu Rực Rỡ!</p>
    </div>

    <!-- FORM XÁC NHẬN MÃ -->
    <div class="card" id="authSection">
        <h3 style="color: #fff; margin-bottom: 10px;">NHẬP MÃ ĐỂ MỞ QUAY</h3>
        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>Họ và Tên Khách Hàng</label>
                <input type="text" id="custName" required placeholder="Ví dụ: Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label>Mã Khách Hàng (4 Số)</label>
                <input type="text" id="custCode" maxlength="4" required placeholder="Ví dụ: 1001">
            </div>
            <button type="submit" class="btn">XÁC NHẬN MỞ QUAY 🚀</button>
        </form>

        <div id="statusBox" style="display: none; margin-top: 10px; color: #00e676; font-weight: bold;">
            <p id="userVerifiedText">Khách hàng: ...</p>
            <p style="color: #ffeb3b; font-size: 13px; margin-top: 5px;">🎉 Bạn có 1 lượt quay duy nhất! Bấm QUAY ở dưới ngay!</p>
        </div>
    </div>

    <!-- VÒNG QUAY -->
    <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
        <button id="btnSpin" class="spin-center-btn" onclick="spinWheel()" disabled>QUAY</button>
    </div>

    <!-- MODAL THÔNG BÁO -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>KẾT QUẢ CỦA BẠN</h2>
            <p id="modalUser">Chúc mừng khách hàng: ...</p>
            <div class="reward-text" id="modalReward">...</div>
            <button class="btn" onclick="location.reload()">Hoàn Tất 🚀</button>
        </div>
    </div>

    <div class="footer">
        Trang web được thiết kế bởi Hải Đăng 7A4 - Siêu Thị Đăng
    </div>
